<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body><div id="navbar"></div><main class="dashboard"><h1>My Bookings</h1><p style="color:var(--muted)">Track your service requests and history.</p><div id="bookings" class="table-wrap">Loading…</div></main><div id="footer"></div><script>
    window.HELPER4U_API = '%VITE_API_URL%';
  </script>
  <script src="app.js"></script><script>fetch(API+'/bookings',{headers:{Authorization:'Bearer '+localStorage.getItem('token')}}).then(r=>r.json()).then(d=>{bookings.innerHTML=`<table class="table"><tr><th>Helper</th><th>Plan</th><th>Start</th><th>Amount</th><th>Status</th></tr>${(d.bookings||[]).map(b=>`<tr><td>${b.helperName}</td><td>${b.plan}</td><td>${b.startDate||'-'}</td><td>₹${b.amount}</td><td><span class="badge ${b.status==='completed'?'green':b.status==='pending'?'yellow':'red'}">${b.status}</span></td></tr>`).join('')}</table>`})</script></body></html>
