<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body><div id="navbar"></div><section class="page-hero"><div class="eyebrow">CONTACT US</div><h1>We’re Here to Help</h1><p>Have a booking question, complaint or partnership request? Send us a message.</p></section><main class="form-wrap"><form class="form-card" id="contactForm"><div class="two-col"><div class="form-group"><label>Name</label><input required></div><div class="form-group"><label>Email</label><input type="email" required></div></div><div class="form-group"><label>Subject</label><input required></div><div class="form-group"><label>Message</label><textarea required></textarea></div><button class="btn btn-primary">Send Message</button><p id="contactMsg"></p></form></main><div id="footer"></div><script src="app.js"></script><script>contactForm.onsubmit=async e=>{e.preventDefault();const msg=document.querySelector("#contactMsg");msg.style.color="";msg.textContent="Sending…";try{const r=await fetch(API+"/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:contactForm.querySelectorAll("input")[0].value,email:contactForm.querySelectorAll("input")[1].value,subject:contactForm.querySelectorAll("input")[2].value,message:contactForm.querySelector("textarea").value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||"Something went wrong");msg.style.color="#14763c";msg.textContent=d.message||"Your message has been sent successfully";contactForm.reset()}catch(e){msg.style.color="#ad2d45";msg.textContent=e.message==="Failed to fetch"?"Unable to reach the server. Please make sure the backend is running (npm run server).":e.message}}</script></body></html>
