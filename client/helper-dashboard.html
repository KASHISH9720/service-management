<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helper Dashboard | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body><div id="navbar"></div><main class="dashboard"><h1>Helper Dashboard</h1><div id="stats" class="stat-grid"></div><br><div id="jobs" class="table-wrap">Loading…</div></main><div id="footer"></div><script src="app.js"></script><script>fetch(API+'/bookings',{headers:{Authorization:'Bearer '+localStorage.getItem('token')}}).then(r=>r.json()).then(d=>{const bs=d.bookings||[];stats.innerHTML=`<div class="card stat"><span>Assigned Jobs</span><strong>${bs.length}</strong></div><div class="card stat"><span>Pending</span><strong>${bs.filter(x=>x.status==='pending').length}</strong></div><div class="card stat"><span>Completed</span><strong>${bs.filter(x=>x.status==='completed').length}</strong></div><div class="card stat"><span>Est. Earnings</span><strong>₹${bs.filter(x=>['accepted','completed'].includes(x.status)).reduce((a,b)=>a+b.amount,0)}</strong></div>`;jobs.innerHTML=`<table class="table"><tr><th>Household</th><th>Plan</th><th>Amount</th><th>Status</th><th>Action</th></tr>${bs.map(b=>`<tr><td>${b.householdName}</td><td>${b.plan}</td><td>₹${b.amount}</td><td>${b.status}</td><td>${b.status==='pending'?`<button class="btn btn-primary" onclick="updateJob('${b._id}','accepted')">Accept</button> <button class="btn btn-outline" onclick="updateJob('${b._id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</table>`});async function updateJob(id,status){await fetch(API+'/bookings/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('token')},body:JSON.stringify({status})});location.reload()}</script></body></html>
