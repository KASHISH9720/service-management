<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helper Profile | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body><div id="navbar"></div><main class="section"><div id="profile" class="card">Loading profile…</div></main><div id="footer"></div><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id');fetch(API+'/helpers/'+id).then(r=>r.json()).then(d=>{const h=d.helper;profile.innerHTML=`<div style="display:flex;gap:25px;align-items:center;flex-wrap:wrap"><div class="helper-avatar" style="width:180px;height:180px">${h.initials}</div><div><div class="eyebrow">VERIFIED HELPER</div><h1>${h.name}</h1><p>${h.serviceType} • ${h.experience} • ${h.city||'India'}</p><p class="rating">★ ${h.rating} (${h.reviewCount} reviews)</p><p>${h.bio||''}</p><div class="tags">${(h.skills||[]).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:28px 0"><h2>Service Plans</h2><div class="grid"><div class="card"><b>Hourly</b><h3>₹${h.pricing.hourly}</h3></div><div class="card"><b>Monthly</b><h3>₹${h.pricing.monthly}</h3></div><div class="card"><b>Yearly</b><h3>₹${h.pricing.yearly}</h3></div></div><br><a class="btn btn-primary" id="bookLink" href="login.html">Login to Book</a>`}); const book=document.querySelector('#bookLink'); if(localStorage.getItem('token')) book.href='booking.html?id='+encodeURIComponent(id); </script></body></html>
