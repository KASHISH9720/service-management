<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body><div id="navbar"></div><main class="dashboard"><h1>Admin Dashboard</h1><div id="stats" class="stat-grid"></div><h2 style="margin-top:40px">Verification Queue</h2><div id="queue" class="table-wrap">Loading…</div></main><div id="footer"></div><script>
    window.HELPER4U_API = '%VITE_API_URL%';
  </script>
  <script src="app.js"></script><script>const H={Authorization:'Bearer '+localStorage.getItem('token')};fetch(API+'/admin/dashboard',{headers:H}).then(r=>r.json()).then(d=>{stats.innerHTML=`<div class="card stat"><span>Households</span><strong>${d.kpis.households}</strong></div><div class="card stat"><span>Verified Helpers</span><strong>${d.kpis.verifiedHelpers}</strong></div><div class="card stat"><span>Total Bookings</span><strong>${d.kpis.bookings}</strong></div><div class="card stat"><span>Completion Rate</span><strong>${d.kpis.completionRate}%</strong></div>`;queue.innerHTML=`<table class="table"><tr><th>Name</th><th>Service</th><th>City</th><th>Action</th></tr>${(d.pending||[]).map(h=>`<tr><td>${h.name}</td><td>${h.serviceType}</td><td>${h.city||'-'}</td><td><button class="btn btn-primary" onclick="verify('${h._id}','verified')">Approve</button> <button class="btn btn-outline" onclick="verify('${h._id}','rejected')">Reject</button></td></tr>`).join('')}</table>`});async function verify(id,status){await fetch(API+'/admin/helpers/'+id+'/verify',{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({status})});location.reload()}</script></body></html>
