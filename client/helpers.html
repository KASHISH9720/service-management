<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Helpers | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body data-page="helpers"><div id="navbar"></div><section class="page-hero"><div class="eyebrow">FIND THE RIGHT HELP</div><h1>Verified Helpers</h1><p>Compare verified maids, babysitters and nannies by service, experience and rating.</p></section><main class="section"><div class="filters"><div class="field"><label>Service</label><select id="type"><option value="">All</option><option value="maid">Maid</option><option value="babysitter">Babysitter</option><option value="nanny">Nanny</option></select></div><div class="field"><label>City</label><input id="city" placeholder="e.g. Meerut"></div><div class="field"><label>Search</label><input id="q" placeholder="Name or skill"></div><button class="btn btn-primary" id="apply">Apply Filters</button></div><div id="helperList" class="helper-grid"></div></main><div id="footer"></div><script>
    window.HELPER4U_API = '%VITE_API_URL%';
  </script>
  <script src="app.js"></script><script>document.querySelector('#apply').onclick=()=>{const p=new URLSearchParams();if(type.value)p.set('type',type.value);if(city.value)p.set('city',city.value);if(q.value)p.set('q',q.value);loadHelperList('#helperList','?'+p.toString())}</script></body></html>
