<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Helper | Helper4U</title><link rel="stylesheet" href="styles.css"></head><body><div id="navbar"></div><main class="form-wrap"><form class="form-card" id="bookingForm"><h1>Book a Helper</h1><p id="helperInfo" class="muted">Loading helper…</p><div class="form-group"><label>Plan</label><select id="plan" required><option value="hourly">Hourly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div><div class="form-group"><label>Start Date</label><input id="startDate" type="date" required></div><div class="form-group"><label>Notes</label><textarea id="notes" placeholder="Tell the helper about your requirements"></textarea></div><button class="btn btn-primary" style="width:100%">Send Booking Request</button><p id="msg"></p></form></main><div id="footer"></div><script src="app.js"></script><script>
const {api, authHeaders, token, escapeHtml}=window.Helper4U; const helperId=new URLSearchParams(location.search).get('id'); const form=document.querySelector('#bookingForm');
(async()=>{ if(!token()){document.querySelector('#msg').textContent='Please login as a household account first.'; form.querySelector('button').disabled=true; return;} try{const d=await api('/helpers/'+helperId); document.querySelector('#helperInfo').innerHTML='<strong>'+escapeHtml(d.helper.name)+'</strong> • '+escapeHtml(d.helper.serviceType)+' • '+escapeHtml(d.helper.city||'India');}catch(e){document.querySelector('#helperInfo').textContent=e.message;}})();
form.onsubmit=async e=>{e.preventDefault();try{const d=await api('/bookings',{method:'POST',headers:authHeaders(true),body:JSON.stringify({helperId,plan:document.querySelector('#plan').value,startDate:document.querySelector('#startDate').value,notes:document.querySelector('#notes').value})});document.querySelector('#msg').textContent=d.message||'Booking request sent.';form.reset();}catch(e){document.querySelector('#msg').textContent=e.message;}};
</script></body></html>
