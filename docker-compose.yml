services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  server:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./server:/app"]
    environment:
      JWT_SECRET: change-this-in-production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/helper4u
    ports: ["5000:5000"]
    depends_on: ["mongo"]
    command: sh -c "npm install && npm run dev"

volumes:
  mongo-data:
